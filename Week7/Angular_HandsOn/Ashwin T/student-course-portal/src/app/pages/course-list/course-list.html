<h1>Course List</h1>


<p *ngIf="isLoading">
  Loading courses...
</p>


<div *ngIf="!isLoading && courses.length > 0; else noCourses">

  <app-course-card
    *ngFor="let course of courses"
    [course]="course">

  </app-course-card>

</div>


<ng-template #noCourses>

  <p>
    No courses available.
  </p>

</ng-template>


<p *ngIf="selectedCourseId">

  Selected Course ID:
  {{selectedCourseId}}

</p>
