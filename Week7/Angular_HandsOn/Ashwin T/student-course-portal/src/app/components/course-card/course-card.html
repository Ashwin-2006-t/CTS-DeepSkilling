<div

class="card"

[ngClass]="cardClasses"


[ngStyle]="{

'border-left-color':

course.gradeStatus==='passed'
?'green':

course.gradeStatus==='failed'
?'red'
:'grey'

}"

appHighlight>


<h2>
{{course.name}}
</h2>


<p>
Code:
{{course.code}}
</p>


<p>
Credits:
{{course.credits}}
</p>


<p>
{{course.credits | creditLabel}}
</p>



<div [ngSwitch]="course.gradeStatus">


<span *ngSwitchCase="'passed'">
🟢 Passed
</span>


<span *ngSwitchCase="'failed'">
🔴 Failed
</span>


<span *ngSwitchDefault>
⚪ Pending
</span>


</div>



<button
(click)="toggleDetails()">

Show Details

</button>


<button
(click)="enrollRequested.emit(course.id)">

Enroll

</button>


</div>
